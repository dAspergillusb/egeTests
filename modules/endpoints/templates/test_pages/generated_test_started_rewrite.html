<script>
  let time = {{ test_time }}; // Задаём начальное время
  const timer = setInterval(() => {
    if (time == 300) {
      document.getElementById('clock').className = "btn btn-outline-warning"
    }
    else if (time == 120) {
      document.getElementById('clock').className = "btn btn-outline-danger"
    }
    if (time > 0) {
      document.getElementById('countdown').textContent = ('0' + Math.floor(time/ (60 * 60))).slice(-2) + " : " + ('0' + Math.floor((time / 60) % 60)).slice(-2) + " : " + ('0' + Math.floor(time % 60)).slice(-2);
    }
    else if (time == 0) {
      document.getElementById('countdown').textContent = "Необходимо закончить тест"
    }
    else if (time <= -10) {
      clearInterval(timer) // Останавливаем таймер, поскольку время истекло
      document.getElementById('finish').click();
     }
      time--; // С каждой секундой уменьшаем время
  }, 1000); // Интервал делаем одной секунды
</script>

    <script src="/static/js/create.alert.save.answer.js"></script>
    <script>
      async function getQuestionData(qNum) {
        try {
            const response = await fetch('{{ url_for("get_question_data") }}', {
                method: 'post',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({q_num: qNum})
            });
            if (response.ok) {
                const result = await response.json();
                console.log(result);
                console.log(result['q_number']);
                showHideInf(qNum);
                putQuestionData(result);
            };
        } catch (error) {
            console.log(error);
        };
      };
    </script>
    <script>
        async function sendAnswer(inputName, divId) {
            var inputNodeList = document.getElementsByName(inputName)
            var inputValue = Array.from(inputNodeList).map(node => node.value)
            try {
                const response = await fetch('{{ url_for("get_answer") }}', {
                    method: 'post',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({q_num: inputName, answer: [...inputValue]})
                });
                if (response.ok) {
                    const result = await response.text();
                    console.log(result);
                    createAlert(divId, result);
                } else {
                    createAlert(divId);
                };
            } catch (error) {
               createAlert(divId);
               console.log(error)
            };
            setTimeout(function() {
                var button = document.getElementById('button');
                var mainDiv = document.getElementById('mainDiv');
                if (button) {
                    button.click();
                };
                if (mainDiv) {
                    mainDiv.remove();
                };
            }, 3000);
        };
    </script>
