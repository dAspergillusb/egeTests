  {% include "navbar/navbar_top_teacher.html" %}
  <div class="container-fluid">
    <!-- Main content -->
  <main class="ms-sm-auto px-md-4">
    <form action="{{ url_for('post_import_from_csv') }}" method="post" enctype=multipart/form-data>
      <div class="w-100">
        <label class="mb-5 h4">Введите текст, который хотите перевести в ckeditor-тэги:</label>

        <div class="mb-5"></div>
          <div class="d-grid gap-2 d-md-block">

                    class="btn btn-secondary py-2 mb-2"

</div>

  <script type="importmap">
    {
        "imports": {
            "ckeditor5": "/static/js/ckeditor5.js",
            "ckeditor5/": "https://cdn.ckeditor.com/ckeditor5/43.3.1/"
        }
    }
  </script>
  <script type="module">
    import {
        ClassicEditor,
        Essentials,
        Heading,
        List,
        Bold,
        Italic,
        Underline,
        Font,
        Paragraph,
        Subscript,
        Superscript,
        BlockQuote,
        Code,
        Table,
        TableCellProperties,
        TableProperties,
        TableToolbar,
        Alignment,
        SpecialCharacters,
        SpecialCharactersEssentials,
        ImageBlock,
	    ImageCaption,
	    ImageInline,
	    ImageInsert,
	    ImageInsertViaUrl,
	    ImageResize,
	    ImageStyle,
	    ImageTextAlternative,
	    ImageToolbar,
	    ImageUpload,
	    AutoImage,
	    Autosave,
	    Base64UploadAdapter
    } from 'ckeditor5';

    let Editor;

    ClassicEditor
        .create( document.getElementById('toTags'), {
            plugins: [ Essentials, Bold, Italic, Underline, Font, Paragraph, Subscript, Superscript, Code, Heading, List,
                      Table, TableCellProperties, TableProperties, TableToolbar, Alignment, BlockQuote, SpecialCharacters, SpecialCharactersEssentials,
                      AutoImage, Autosave, Base64UploadAdapter, ImageBlock, ImageCaption, ImageInline, ImageInsert, ImageInsertViaUrl, ImageResize,
                      ImageStyle, ImageTextAlternative, ImageToolbar, ImageUpload
            ],
            toolbar: [
                'undo', 'redo', '|', 'heading', 'alignment', '|', 'bold', 'italic', 'underline', '|',
                'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
                'subscript', 'superscript', 'specialCharacters', 'code', '|', 'bulletedList', 'numberedList', '|', 'insertTable', 'insertImage', 'blockQuote'
            ],
            table: {
                contentToolbar: [ 'tableColumn', 'tableRow', 'mergeTableCells', 'tableProperties', 'tableCellProperties' ]
            },
            image: {
                toolbar: [
                    'toggleImageCaption',
                    'imageTextAlternative',
                    '|',
                    'imageStyle:inline',
                    'imageStyle:wrapText',
                    'imageStyle:breakText',
                    '|',
                    'resizeImage'
                ]
            }
        } )
        .then( newEditor => {
          Editor = newEditor;
        } )
        .catch( error => {
          console.error( error );
        } );
  </script>
  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <script>
    async function sendTextWithTags() {
        const editorData = Editor.getData();
        console.log(editorData);
        var ckeditorValue = document.getElementById('toTags')
        console.log(ckeditorValue);
        const response = await fetch('{{ url_for("post_to_html_tags") }}', {
            method: 'post',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({html_tags: ckeditorValue})
        });
        const result = await response.json();
        console.log(result);
    };
  </script>
