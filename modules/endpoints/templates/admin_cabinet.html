  <script>
    async function getDataFromTopic(topicNum) {
      try {
        const response = await fetch('{{ url_for("get_data_from_topic") }}', {
          method: 'post',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({topic: topicNum})
        });
        if (response.ok) {
          const result = await response.json();
          // console.log(result);
          createStructure(result);
          const navButtons = document.querySelectorAll('[name="navButton"]');
          navButtons.forEach(navButton => {
              navButton.classList.replace('btn-primary', 'btn-outline-primary');
          });
          const chosenNavElement = document.querySelector(`[id="${topicNum}"]`);
          chosenNavElement.classList.replace('btn-outline-primary', 'btn-primary');
        }
      }  catch (error) {
        console.log(error);
      }
    }
  </script>
  <script>
      async function getDataToSave(qNumber) {
        const form = document.getElementById('form');
        const formData = new FormData(form);
        formData.set('q_text', window.editorInstance.getData());
        formData.set('q_number', qNumber);
        try {
            const response = await fetch('{{ url_for("create_question") }}', {
                method: 'post',
                body: formData
            });
            if (response.ok) {
                const result = await response.json();
                // console.log(result);
                createAlert(result);
            }
        } catch (error) {
            console.log(error);
        }
      }
  </script>
  <script>
      async function getDataToSave1921() {
          const form = document.getElementById('form');
          const formData = new FormData(form);
          formData.set('q_text_19', window.editorInstance.getData());
          formData.set('q_text_20', window.editorInstanceTwo.getData());
          formData.set('q_text_21', window.editorInstanceThree.getData());
          try {
              const response = await fetch('{{ url_for("create_question_19_21") }}', {
                  method: 'post',
                  body: formData
              });
              if (response.ok) {
                  const result = await response.json();
                  // console.log(result);
                  createAlert(result);
              }
          } catch (error) {
              console.log(error);
          }
      }
  </script>
  <script>
      async function getTypeQuestions(qType) {
        try {
            const response = await fetch('{{ url_for("get_all_type_questions") }}', {
                method: 'post',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({q_type: qType})
            });
            if (response.ok) {
                const result = await response.json();
                // console.log(Array.isArray(result));
                if (qType == '19') {
                   getSpecialQuestions(result);
                } else {
                   getStandardQuestions(result);
                }
                // console.log(qType);
            }
        } catch (error) {
            console.log(error);
        }
      }
  </script>
